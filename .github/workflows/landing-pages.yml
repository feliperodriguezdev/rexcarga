# Publica la landing (landing/public) en GitHub Pages en cada push a master
# que la toque. Requiere Settings → Pages → Source: "GitHub Actions".
# Es una vista previa: GitHub Pages no ejecuta landing/functions, así que el
# formulario de cotización no envía correo (ofrece WhatsApp como respaldo).
# El sitio definitivo va en Cloudflare Pages (ver README de la raíz).
name: Publicar landing en GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "landing/public/**"
      - ".github/workflows/landing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/public
      - id: despliegue
        uses: actions/deploy-pages@v4
